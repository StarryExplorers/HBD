<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday Grandpa</title>
<style>
  body, html {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(#07142a, #000011);
    color: #fff;
  }
  canvas {
    display: block;
  }
  .message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(30px, 5vw, 70px);
    font-weight: 800;
    text-align: center;
    color: #fff;
    text-shadow:
      0 0 10px #fff,
      0 0 20px #aaffff,
      0 0 30px #55ccff,
      0 0 40px #33bbff;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="message">Happy Birthday, Grandpa</div>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

function drawMoon() {
  const moonX = width * 0.8;
  const moonY = height * 0.2;
  const radius = 60;

  ctx.save();
  ctx.fillStyle = '#ffffcc';
  ctx.beginPath();
  ctx.arc(moonX, moonY, radius, 0, Math.PI * 2);
  ctx.fill();

  // half shadow
  ctx.fillStyle = '#07142a';
  ctx.beginPath();
  ctx.arc(moonX + 20, moonY, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

let lanterns = [];
for(let i=0; i<6; i++) {
  lanterns.push({
    x: Math.random() * width,
    y: Math.random() * height * 0.6 + height * 0.2,
    angle: Math.random() * Math.PI * 2,
    swing: Math.random() * 0.02 + 0.01
  });
}

function drawLantern(lantern) {
  ctx.save();
  ctx.translate(lantern.x, lantern.y);
  ctx.rotate(Math.sin(lantern.angle) * 0.3);
  ctx.fillStyle = 'orange';
  ctx.beginPath();
  ctx.ellipse(0, 0, 15, 25, 0, 0, Math.PI * 2);
  ctx.fill();
  // glow
  ctx.shadowColor = 'rgba(255,200,100,0.6)';
  ctx.shadowBlur = 20;
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.clearRect(0,0,width,height);
  drawMoon();

  lanterns.forEach(lantern => {
    lantern.angle += lantern.swing;
    drawLantern(lantern);
  });

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
});
</script>
</body>
</html>
